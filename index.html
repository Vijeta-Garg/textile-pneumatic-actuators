<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Actuators vs Hand Massage</title>
<style>
  :root {
    --bg: #000;
    --card: #111;
    --text: #fff;
    --muted: #8a8a8a;
    --act-w: 314px;   /* actuator tile width (16:9-ish) */
    --hand-w: 210px;  /* massage-hands tile width */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    padding: 24px 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: var(--act-w) var(--hand-w) var(--act-w) var(--hand-w);
    column-gap: 12px;
    row-gap: 24px;
  }
  /* extra space between the two actuator/hands pairs */
  .grid > :nth-child(4n + 3) { margin-left: 13px; }

  figure { margin: 0; display: flex; flex-direction: column; }
  video {
    display: block;
    width: 100%;
    background: #000;
    object-fit: cover;
    cursor: zoom-in;
  }

  /* Actuator tiles: video with a plain white caption beneath */
  .actuator video { aspect-ratio: 310 / 172; border-radius: 4px; }
  .actuator figcaption {
    font-size: 14px;
    text-align: center;
    padding-top: 11px;
  }
  /* The new effleurage clip is portrait: show the whole frame */
  .actuator video.portrait { object-fit: contain; }

  /* Massage-hands tiles: card with uppercase grey caption */
  .hands { background: var(--card); border-radius: 4px; overflow: hidden; }
  .hands video { aspect-ratio: 206 / 164; }
  .hands figcaption {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    line-height: 1.15;
    padding: 6px 4px 8px;
  }

  .placeholder {
    aspect-ratio: 310 / 172;
    border: 1px dashed #444;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 12px;
  }

  /* Click-to-enlarge overlay */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 10; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox video { width: auto; height: auto; max-width: 92vw; max-height: 92vh; object-fit: contain; cursor: zoom-out; }

  /* Narrow screens: one actuator/hands pair per row */
  @media (max-width: 1150px) {
    .grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
    .grid > :nth-child(4n + 3) { margin-left: 0; }
  }
</style>
</head>
<body>
  <main class="grid">
    <figure class="actuator">
      <video class="portrait" src="videos/effleurage_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>1. Effleurage Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/effleurage_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>1. Effleurage with massage hands</figcaption>
    </figure>
    <figure class="actuator">
      <video src="videos/petrissage_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>2. Petrissage Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/petrissage_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>2. Petrissage with massage hands</figcaption>
    </figure>

    <figure class="actuator">
      <video src="videos/tapotement_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>3. Tapotement Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/tapotement_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>3. Tapotement with massage hands</figcaption>
    </figure>
    <figure class="actuator" id="friction-actuator">
      <video src="videos/friction_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>4. Friction Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/friction_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>4. Friction with massage hands</figcaption>
    </figure>
  </main>

  <div class="lightbox" id="lightbox"><video muted loop playsinline controls></video></div>

<script>
  // If a clip is missing (e.g. friction_actuator.mp4 not added yet), show a placeholder.
  document.querySelectorAll('main video').forEach(function (v) {
    v.addEventListener('error', function () {
      var p = document.createElement('div');
      p.className = 'placeholder';
      p.textContent = 'Add ' + v.getAttribute('src') + ' to show this clip';
      v.replaceWith(p);
    });
  });

  // Click any tile to view it large.
  var box = document.getElementById('lightbox');
  var big = box.querySelector('video');
  document.querySelector('main').addEventListener('click', function (e) {
    if (e.target.tagName !== 'VIDEO') return;
    big.src = e.target.currentSrc;
    big.currentTime = e.target.currentTime;
    box.classList.add('open');
    big.play();
  });
  box.addEventListener('click', function (e) {
    if (e.target === big) return;
    box.classList.remove('open');
    big.pause();
    big.removeAttribute('src');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') box.click();
  });
</script>
</body>
</html>
