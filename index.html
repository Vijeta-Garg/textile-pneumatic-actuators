<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textile Pneumatic Actuators for Mechanotherapy</title>
<style>
  :root {
    --bg: #000;
    --card: #111;
    --text: #fff;
    --muted: #8a8a8a;
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    padding: 32px 24px;
  }
  h1 {
    font-weight: normal;
    font-size: clamp(22px, 2.4vw, 34px);
    text-align: center;
    margin: 0 0 32px;
  }
  .grid {
    width: min(1640px, 100%);
    display: grid;
    /* actuator, hands, spacer, actuator, hands (spacer + 2 gaps separates the pairs) */
    grid-template-columns: 3fr 2fr 0 3fr 2fr;
    column-gap: var(--gap);
    row-gap: 32px;
    align-items: start;
  }
  .grid > :nth-child(4n + 3) { grid-column: 4; }
  .grid > :nth-child(4n + 4) { grid-column: 5; }

  figure { margin: 0; display: flex; flex-direction: column; min-width: 0; }
  video {
    display: block;
    width: 100%;
    background: #000;
    object-fit: cover;
    cursor: zoom-in;
  }

  /* Actuator tiles: video with a plain white caption beneath */
  .actuator video { aspect-ratio: 310 / 172; border-radius: 6px; }
  /* Portrait clips: show the whole frame instead of cropping it */
  .actuator video.portrait { object-fit: contain; }
  .actuator figcaption {
    font-size: clamp(14px, 1.15vw, 18px);
    text-align: center;
    padding-top: 12px;
  }

  /* Massage-hands tiles: card with uppercase grey caption */
  .hands { background: var(--card); border-radius: 6px; overflow: hidden; }
  .hands video { aspect-ratio: 206 / 164; }
  .hands figcaption {
    font-size: clamp(12px, 0.95vw, 15px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
    padding: 8px 6px 10px;
  }

  .placeholder {
    aspect-ratio: 310 / 172;
    border: 1px dashed #444;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 12px;
  }

  /* Click-to-enlarge overlay */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 10; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox video { width: auto; height: auto; max-width: 92vw; max-height: 92vh; object-fit: contain; cursor: zoom-out; }

  /* Narrow screens: one actuator/hands pair per row */
  @media (max-width: 900px) {
    body { padding: 24px 16px; }
    .grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); column-gap: 12px; row-gap: 24px; }
    .grid > :nth-child(n) { grid-column: auto; }
  }
</style>
</head>
<body>
  <h1>Textile Pneumatic Actuators for Mechanotherapy</h1>

  <main class="grid">
    <figure class="actuator">
      <video src="videos/effleurage_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>1. Effleurage Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/effleurage_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>1. Effleurage with massage hands</figcaption>
    </figure>
    <figure class="actuator">
      <video src="videos/friction_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>2. Friction Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/friction_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>2. Friction with massage hands</figcaption>
    </figure>

    <figure class="actuator">
      <video src="videos/petrissage_actuator.mp4?v=82385-1.2x" autoplay muted loop playsinline></video>
      <figcaption>3. Petrissage Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/petrissage_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>3. Petrissage with massage hands</figcaption>
    </figure>
    <figure class="actuator">
      <video src="videos/tapotement_actuator.mp4" autoplay muted loop playsinline></video>
      <figcaption>4. Tapotement Actuator</figcaption>
    </figure>
    <figure class="hands">
      <video src="videos/tapotement_hands.mp4" autoplay muted loop playsinline></video>
      <figcaption>4. Tapotement with massage hands</figcaption>
    </figure>
  </main>

  <div class="lightbox" id="lightbox"><video muted loop playsinline controls></video></div>

<script>
  // If a clip is missing, show a placeholder instead of a broken player.
  document.querySelectorAll('main video').forEach(function (v) {
    v.addEventListener('error', function () {
      var p = document.createElement('div');
      p.className = 'placeholder';
      p.textContent = 'Add ' + v.getAttribute('src') + ' to show this clip';
      v.replaceWith(p);
    });
  });

  // Click any tile to view it large.
  var box = document.getElementById('lightbox');
  var big = box.querySelector('video');
  document.querySelector('main').addEventListener('click', function (e) {
    if (e.target.tagName !== 'VIDEO') return;
    big.src = e.target.currentSrc;
    big.currentTime = e.target.currentTime;
    box.classList.add('open');
    big.play();
  });
  box.addEventListener('click', function (e) {
    if (e.target === big) return;
    box.classList.remove('open');
    big.pause();
    big.removeAttribute('src');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') box.click();
  });
</script>
</body>
</html>
